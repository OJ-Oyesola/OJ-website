name: Cloudflare provision resources

on:
  workflow_dispatch:
    inputs:
      database_name:
        description: D1 database name
        required: true
        default: oj-website
      media_bucket_name:
        description: Primary R2 bucket name
        required: true
        default: oj-website-media
      preview_bucket_name:
        description: Preview R2 bucket name
        required: true
        default: oj-website-media-preview
      d1_location:
        description: D1 primary location hint
        required: true
        default: enam
      r2_location:
        description: R2 location hint
        required: true
        default: enam
  push:
    branches: [arena/01a07d0a-oj-website]

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: oj-website-api
      CF_D1_DATABASE_NAME: ${{ inputs.database_name || 'oj-website' }}
      CF_R2_MEDIA_BUCKET: ${{ inputs.media_bucket_name || '' }}
      CF_R2_MEDIA_PREVIEW_BUCKET: ${{ inputs.preview_bucket_name || '' }}
      D1_LOCATION: ${{ inputs.d1_location || 'enam' }}
      R2_LOCATION: ${{ inputs.r2_location || 'enam' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Verify required Cloudflare secrets exist
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Resolve resource names
        id: names
        run: |
          set -euo pipefail
          suffix=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr '[:upper:]' '[:lower:]' | tail -c 9)
          media_bucket=${CF_R2_MEDIA_BUCKET:-}
          preview_bucket=${CF_R2_MEDIA_PREVIEW_BUCKET:-}
          if [ -z "$media_bucket" ] || [ "$media_bucket" = "oj-website-media" ]; then
            media_bucket="oj-website-media-$suffix"
          fi
          if [ -z "$preview_bucket" ] || [ "$preview_bucket" = "oj-website-media-preview" ]; then
            preview_bucket="oj-website-media-preview-$suffix"
          fi
          echo "media_bucket=$media_bucket" >> "$GITHUB_OUTPUT"
          echo "preview_bucket=$preview_bucket" >> "$GITHUB_OUTPUT"
          echo "CF_R2_MEDIA_BUCKET=$media_bucket" >> "$GITHUB_ENV"
          echo "CF_R2_MEDIA_PREVIEW_BUCKET=$preview_bucket" >> "$GITHUB_ENV"
          {
            echo "Using D1 database: $CF_D1_DATABASE_NAME"
            echo "Using R2 bucket: $media_bucket"
            echo "Using R2 preview bucket: $preview_bucket"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Ensure R2 buckets exist
        env:
          MEDIA_BUCKET: ${{ steps.names.outputs.media_bucket }}
          PREVIEW_BUCKET: ${{ steps.names.outputs.preview_bucket }}
        run: |
          set +e
          FAILED=0
          ensure_bucket() {
            local name="$1"
            local output
            if output=$(npx wrangler r2 bucket info "$name" 2>&1); then
              echo "$output"
              echo "R2 bucket already exists: $name"
            else
              echo "$output"
              echo "Creating R2 bucket: $name"
              npx wrangler r2 bucket create "$name" --location "$R2_LOCATION"
              return $?
            fi
          }
          ensure_bucket "$MEDIA_BUCKET" || FAILED=1
          ensure_bucket "$PREVIEW_BUCKET" || FAILED=1
          if [ "$FAILED" -ne 0 ]; then
            echo "CF_R2_MEDIA_BUCKET=" >> "$GITHUB_ENV"
            echo "CF_R2_MEDIA_PREVIEW_BUCKET=" >> "$GITHUB_ENV"
            echo "R2 provisioning failed in this run; continuing with D1 + Worker deployment only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "R2 provisioning succeeded." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Ensure D1 database exists
        run: |
          set -euo pipefail
          DB_ID=$(npx wrangler d1 list --json | node -e 'const fs = require("fs"); const list = JSON.parse(fs.readFileSync(0, "utf8")); const name = process.env.CF_D1_DATABASE_NAME; const db = list.find((entry) => entry.name === name); if (db) process.stdout.write(db.uuid || db.id || "");')
          if [ -z "$DB_ID" ]; then
            CREATE_OUTPUT=$(npx wrangler d1 create "$CF_D1_DATABASE_NAME" --location "$D1_LOCATION")
            echo "$CREATE_OUTPUT"
            DB_ID=$(printf '%s' "$CREATE_OUTPUT" | node -e 'const fs = require("fs"); const out = fs.readFileSync(0, "utf8"); const match = out.match(/database_id\s*=\s*"([^"]+)"/); if (!match) process.exit(1); process.stdout.write(match[1]);')
          else
            echo "D1 database already exists: $CF_D1_DATABASE_NAME ($DB_ID)"
          fi
          echo "CF_D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
      - name: Update Wrangler config and tracked resource manifest
        env:
          CF_WORKER_NAME: ${{ env.CF_WORKER_NAME }}
          CF_D1_DATABASE_NAME: ${{ env.CF_D1_DATABASE_NAME }}
          CF_D1_DATABASE_ID: ${{ env.CF_D1_DATABASE_ID }}
          CF_R2_MEDIA_BUCKET: ${{ steps.names.outputs.media_bucket }}
          CF_R2_MEDIA_PREVIEW_BUCKET: ${{ steps.names.outputs.preview_bucket }}
        run: python3 tools/update_cloudflare_config.py
      - name: Apply D1 schema
        run: npx wrangler d1 execute "$CF_D1_DATABASE_NAME" --remote --file db/migrations/0001_initial.sql
      - name: Sync optional admin API token
        env:
          CLOUDFLARE_WORKER_ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_ADMIN_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_WORKER_ADMIN_TOKEN:-}" ]; then
            echo "No CLOUDFLARE_WORKER_ADMIN_TOKEN secret provided; skipping Worker admin-token sync."
            exit 0
          fi
          printf '%s' "$CLOUDFLARE_WORKER_ADMIN_TOKEN" | npx wrangler secret put ADMIN_API_TOKEN
      - name: Commit generated Cloudflare config
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml cloudflare/resources.json
          if git diff --cached --quiet; then
            echo "No tracked Cloudflare config changes to commit."
          else
            git commit -m "Provision Cloudflare resources [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Deploy Worker
        id: deploy
        run: |
          set +e
          deploy_log=$(mktemp)
          npx wrangler deploy 2>&1 | tee "$deploy_log"
          status=${PIPESTATUS[0]}
          worker_url=$(node -e 'const fs = require("fs"); const text = fs.readFileSync(process.argv[1], "utf8"); const matches = [...text.matchAll(/https?:\/\/[A-Za-z0-9.-]+\.workers\.dev\b/g)].map((match) => match[0]); if (matches.length) process.stdout.write(matches[matches.length - 1]);' "$deploy_log")
          if [ -n "$worker_url" ]; then
            echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
            echo "CF_WORKER_URL=$worker_url" >> "$GITHUB_ENV"
            echo "Worker URL: $worker_url" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$status" -ne 0 ]; then
            echo "Worker deployment failed in this run; resources and schema were still provisioned." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Persist deployed Worker URL
        if: ${{ steps.deploy.outputs.worker_url != '' }}
        env:
          CF_WORKER_NAME: ${{ env.CF_WORKER_NAME }}
          CF_D1_DATABASE_NAME: ${{ env.CF_D1_DATABASE_NAME }}
          CF_D1_DATABASE_ID: ${{ env.CF_D1_DATABASE_ID }}
          CF_R2_MEDIA_BUCKET: ${{ steps.names.outputs.media_bucket }}
          CF_R2_MEDIA_PREVIEW_BUCKET: ${{ steps.names.outputs.preview_bucket }}
          CF_WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: python3 tools/update_cloudflare_config.py
      - name: Commit deployed Worker URL
        if: ${{ steps.deploy.outputs.worker_url != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/resources.json
          if git diff --cached --quiet; then
            echo "No deployed Worker URL changes to commit."
          else
            git commit -m "Persist deployed Worker URL [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Summarize
        env:
          DEPLOYED_WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          {
            echo "## Cloudflare resources"
            echo "- Worker: $CF_WORKER_NAME"
            if [ -n "${DEPLOYED_WORKER_URL:-}" ]; then
              echo "- Worker URL: $DEPLOYED_WORKER_URL"
            fi
            echo "- D1 database: $CF_D1_DATABASE_NAME ($CF_D1_DATABASE_ID)"
            echo "- R2 bucket: ${CF_R2_MEDIA_BUCKET:-not bound}"
            echo "- R2 preview bucket: ${CF_R2_MEDIA_PREVIEW_BUCKET:-not bound}"
          } >> "$GITHUB_STEP_SUMMARY"
