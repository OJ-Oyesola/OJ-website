<head>

  <style>
    body { display: grid; place-items: center; min-height: 100vh; background: var(--coal); color: var(--cream); text-align: center; }
    .nf { display: grid; gap: 1.4rem; justify-items: center; padding: 2rem; }
    .nf .code { font-family: var(--font-display); font-size: clamp(6rem, 22vw, 13rem); line-height: 1; color: rgba(237,231,219,0.14); }
    .nf h1 { font-size: clamp(1.6rem, 4vw, 2.6rem); }
    .nf h1 em { font-family: var(--font-script); font-style: normal; color: #C9A87A; font-size: 1.2em; }
    .nf p { color: var(--cream-soft); max-width: 38ch; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="code">404</div>
    <h1>Even this moment wasn't <em>meant to last.</em></h1>
    <p>The page you're looking for has drifted out of frame — but there's plenty more to see.</p>
    <a class="btn btn--light" href="index.html">Back to the gallery
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M13 5l7 7-7 7"/></svg></a>
  </main>
