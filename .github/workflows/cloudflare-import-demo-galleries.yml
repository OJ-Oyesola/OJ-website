name: Cloudflare import demo galleries

on:
  workflow_dispatch:
  push:
    branches: [arena/01a07d0a-oj-website]
    paths:
      - .github/workflows/cloudflare-import-demo-galleries.yml
      - tools/import_client_galleries.js
      - package.json

permissions:
  contents: read

jobs:
  import-demo-galleries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_WORKER_ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify backend import prerequisites
        run: |
          test -n "$CLOUDFLARE_WORKER_ADMIN_TOKEN"
          node -e 'const fs = require("fs"); const data = JSON.parse(fs.readFileSync("cloudflare/resources.json", "utf8")); if (!data.worker || !data.worker.url) { console.error("cloudflare/resources.json is missing worker.url"); process.exit(1); } console.log(`Using Worker URL: ${data.worker.url}`);'
      - name: Verify Worker admin API access
        env:
          ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_ADMIN_TOKEN }}
        run: |
          export ADMIN_API_BASE=$(node -e 'const fs = require("fs"); const data = JSON.parse(fs.readFileSync("cloudflare/resources.json", "utf8")); process.stdout.write(data.worker.url);')
          cat > preflight-check.mjs <<'EOF'
          const attempt = process.env.ATTEMPT;
          const base = process.env.ADMIN_API_BASE;
          const token = process.env.ADMIN_API_TOKEN;
          const health = await fetch(base + '/health');
          const healthText = await health.text();
          console.log(`Health [attempt ${attempt}]: ${health.status} ${healthText}`);
          const admin = await fetch(base + '/api/admin/galleries', {
            headers: { authorization: `Bearer ${token}` }
          });
          const adminText = await admin.text();
          console.log(`Admin galleries [attempt ${attempt}]: ${admin.status} ${adminText}`);
          if (!admin.ok) {
            const snippet = String(adminText || '').replace(/\s+/g, ' ').slice(0, 300);
            throw new Error(`Worker admin API preflight failed with ${admin.status}: ${snippet}`);
          }
          EOF
          success=0
          for attempt in 1 2 3 4 5 6; do
            echo "Preflight attempt $attempt..."
            if ATTEMPT="$attempt" node preflight-check.mjs > preflight.log 2>&1; then
              cat preflight.log
              success=1
              break
            fi
            cat preflight.log
            sleep 10
          done
          if [ "$success" -ne 1 ]; then
            tail -n 20 preflight.log
            echo "::error::Worker admin API preflight failed after retries."
            exit 1
          fi
      - name: Import demo galleries into Worker backend
        id: import
        continue-on-error: true
        env:
          ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_ADMIN_TOKEN }}
        run: |
          export ADMIN_API_BASE=$(node -e 'const fs = require("fs"); const data = JSON.parse(fs.readFileSync("cloudflare/resources.json", "utf8")); process.stdout.write(data.worker.url);')
          npm run import:demo-galleries -- --visibility private 2>&1 | tee import.log
          exit ${PIPESTATUS[0]}
      - name: Fail if demo import failed
        if: ${{ steps.import.outcome != 'success' }}
        run: |
          tail -n 40 import.log
          echo "::error::Demo gallery import failed. See log tail above."
          exit 1
      - name: Summarize backend client galleries
        env:
          ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_ADMIN_TOKEN }}
        run: |
          export ADMIN_API_BASE=$(node -e 'const fs = require("fs"); const data = JSON.parse(fs.readFileSync("cloudflare/resources.json", "utf8")); process.stdout.write(data.worker.url);')
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          (async () => {
            const base = process.env.ADMIN_API_BASE;
            const token = process.env.ADMIN_API_TOKEN;
            const response = await fetch(base + '/api/admin/galleries', {
              headers: { authorization: `Bearer ${token}` }
            });
            if (!response.ok) {
              const text = await response.text();
              throw new Error(`Failed to list galleries: ${response.status} ${text}`);
            }
            const payload = await response.json();
            const galleries = (payload.galleries || []).filter((gallery) => gallery.kind === 'client');
            console.log('## Backend client galleries');
            if (!galleries.length) {
              console.log('- No client galleries found.');
            } else {
              for (const gallery of galleries) {
                console.log(`- ${gallery.title} (${gallery.slug}) — ${gallery.photoCount} records`);
              }
            }
          })().catch((error) => {
            console.error(error && error.message ? error.message : error);
            process.exit(1);
          });
          EOF
